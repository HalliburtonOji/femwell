<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- FemWell PWA / home-screen icon — brand bloom on cream. Self-contained, no external refs. -->
  <rect width="512" height="512" rx="112" fill="#F4EDDB"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#3A2C1A" stroke-opacity="0.10" stroke-width="4"/>
  <!-- stem + leaves -->
  <path d="M256 392 C256 332, 256 300, 256 256" stroke="#6F8B6F" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M256 336 C220 330, 196 306, 190 274 C228 276, 252 300, 256 332 Z" fill="#8FAF8F"/>
  <path d="M256 312 C292 306, 316 282, 322 250 C284 252, 260 276, 256 308 Z" fill="#8FAF8F" opacity="0.85"/>
  <!-- bloom: layered petals (peony) in blush, gold heart -->
  <g transform="translate(256 196)">
    <g fill="#E8B4B8">
      <ellipse cx="0" cy="-58" rx="34" ry="56"/>
      <ellipse cx="0" cy="-58" rx="34" ry="56" transform="rotate(60)"/>
      <ellipse cx="0" cy="-58" rx="34" ry="56" transform="rotate(120)"/>
      <ellipse cx="0" cy="-58" rx="34" ry="56" transform="rotate(180)"/>
      <ellipse cx="0" cy="-58" rx="34" ry="56" transform="rotate(240)"/>
      <ellipse cx="0" cy="-58" rx="34" ry="56" transform="rotate(300)"/>
    </g>
    <g fill="#D99AA0" opacity="0.9">
      <ellipse cx="0" cy="-40" rx="22" ry="38" transform="rotate(30)"/>
      <ellipse cx="0" cy="-40" rx="22" ry="38" transform="rotate(150)"/>
      <ellipse cx="0" cy="-40" rx="22" ry="38" transform="rotate(270)"/>
    </g>
    <circle cx="0" cy="0" r="26" fill="#D4AF37"/>
    <circle cx="0" cy="0" r="26" fill="#A6862B" opacity="0.25"/>
  </g>
</svg>
