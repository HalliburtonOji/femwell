<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet"><style>body{margin:0;background:#F4EFE3;padding:24px;display:flex;gap:20px;align-items:center}</style></head><body>
<div id="w"></div><div id="w2"></div>
<script>
function cycleWheel(size){const cx=size/2,cy=size/2,r=size/2-7;const arcs=[['#BC2E27',0,0.22],['#8FAF8F',0.22,0.55],['#D4AF37',0.55,0.72],['#8E6E8E',0.72,1]];const pt=(f)=>{const a=(f*360-90)*Math.PI/180;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};let s=`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`;for(const [col,a,b] of arcs){const [x1,y1]=pt(a),[x2,y2]=pt(b);const large=(b-a)>0.5?1:0;s+=`<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"/>`;}const [mx,my]=pt(0.42);s+=`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="5" fill="#F4EFE3" stroke="#8FAF8F" stroke-width="2.5"/>`;s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-family="Cormorant Garamond,serif" font-weight="600" font-size="15" fill="#7A1A12">Day</text><text x="${cx}" y="${cy+13}" text-anchor="middle" font-family="Cormorant Garamond,serif" font-weight="600" font-size="16" fill="#7A1A12">14</text></svg>`;return s;}
document.getElementById('w').innerHTML=cycleWheel(80);document.getElementById('w2').innerHTML=cycleWheel(120);
</script></body></html>
