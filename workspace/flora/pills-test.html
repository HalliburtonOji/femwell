<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F4EFE3;padding:22px;font-family:'Cormorant Garamond',serif}
.h{font-style:italic;font-weight:600;font-size:26px;color:#7A1A12;margin:0 0 10px}
.pillrow{display:flex;gap:10px;max-width:360px}
.apill{flex:1;border:none;border-radius:999px;padding:15px 18px;font-family:ui-sans-serif,system-ui;font-size:15px;font-weight:700;color:#fff;text-align:center;box-shadow:0 4px 14px rgba(58,44,26,.18)}
.apill.plum{background:#8E6E8E}.apill.gold{background:#A8893F}
.sw{display:inline-block;width:80px;height:40px;border-radius:8px;vertical-align:middle;margin-right:8px}</style></head><body>
<div class="h">Where your body is today — oxblood #7A1A12</div>
<div class="pillrow"><span class="apill plum">Speak your plan</span><span class="apill gold">Plan a day</span></div>
<div style="margin-top:18px"><span class="sw" style="background:#7A1A12"></span><span style="font-family:ui-sans-serif">#7A1A12 oxblood — headings</span></div>
</body></html>
