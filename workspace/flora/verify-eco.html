<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#ECE7DA;font-family:Georgia,serif}.row{display:flex;gap:16px;padding:20px;align-items:flex-end;flex-wrap:wrap}.c{display:flex;flex-direction:column;align-items:center;width:150px}.l{font-size:13px;color:#6B5840;text-transform:uppercase;letter-spacing:.1em}.card{background:#F4EFE3;border:1px solid #D8CFBC;border-radius:14px;padding:8px}</style></head><body>
<div class="row" id="r"></div>
<script src="extract.js"></script>
<script>
const items=[['rose bud',roseBud(150)],['rose bloom',bloomSVG('rose','crimson',150)],['rose hip (seed)',roseHip(150)],['rose rest (cane)',roseRest(150)],['robin',bird(110)],['ladybird',ladybird(70)],['wax seal',waxSeal(90)],['snowdrop',bloomSVG('snowdrop','cream',150)]];
document.getElementById('r').innerHTML=items.map(([n,s])=>`<div class="c"><div class="card">${s}</div><div class="l">${n}</div></div>`).join('');
</script></body></html>
