<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#ECE7DA;font-family:Georgia,serif;color:#2E261B}
.wrap{padding:18px}
h1{font-family:Georgia;font-style:italic;color:#A8893F;font-weight:500;font-size:24px;margin:0 0 2px}
.sub{font-family:ui-sans-serif,system-ui;font-size:13px;color:#6B5840;margin-bottom:14px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.cell{width:100px;display:flex;flex-direction:column;align-items:center;gap:2px}
.card{background:#F4EFE3;border:1px solid #D8CFBC;border-radius:12px;padding:5px;width:100px;height:104px;display:flex;align-items:flex-end;justify-content:center}
.nm{font-family:ui-sans-serif,system-ui;font-size:10px;letter-spacing:.02em;text-transform:uppercase;color:#6B5840;text-align:center;line-height:1.1}
</style></head><body><div class="wrap">
<h1>FemWell Flora — the botanical library</h1>
<div class="sub" id="count"></div>
<div class="grid" id="g"></div>
</div>
<script src="lib50.js"></script><script src="lib50b.js"></script><script>
const g=document.getElementById('g');
g.innerHTML=SPECIES.map(s=>`<div class="cell"><div class="card">${bloom(s.n,86)}</div><div class="nm">${s.n.replace(/-/g,' ')}</div></div>`).join('');
document.getElementById('count').textContent=SPECIES.length+' distinct species + lifecycle/bud forms — each drawn to read as itself.';
</script></body></html>
