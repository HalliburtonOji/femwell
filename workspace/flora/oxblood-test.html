<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Ephesis&display=swap" rel="stylesheet">
<style>body{margin:0;background:#ECE7DA;padding:28px;font-family:Georgia}

<div><span class="sw" style="background:#7E1B16"></span><span style="font-family:ui-sans-serif">#7E1B16 oxblood — headings</span></div>
