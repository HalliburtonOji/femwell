<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#ECE7DA;--paperHi:#F4EFE3;--paperDeep:#D8CFBC;--ink:#0B0805;--inkSoft:#1A140D;--gold:#A8893F;--crimson:#BC2E27;--serif:'Cormorant Garamond',Georgia,serif;--sans:ui-sans-serif,system-ui}
body{margin:0;background:#F4EFE3;padding:20px;font-family:var(--serif)}
.clipdemo{position:relative;height:200px;margin:14px 0 8px;max-width:420px}
.clip{position:absolute;border:1px solid var(--paperDeep);border-radius:16px;background:var(--paper);box-shadow:0 6px 18px rgba(58,44,26,.12)}
.clip.back{left:30%;top:14px;width:64%;height:168px;background:#E7E0D0;transform:rotate(2deg)}
.clip.front{left:4%;top:6px;width:64%;height:182px;background:linear-gradient(180deg,#F6F1E5,#EFE7D4);border-left:4px solid var(--gold)}
.cliptop{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.clip-clip{width:34px;height:9px;border-radius:4px;background:var(--gold);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.clip-ttl{font-family:var(--serif);font-style:italic;font-weight:600;font-size:18px;color:var(--ink)}
.clipgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 14px 14px}
.clipgrid span{background:var(--paperHi);border:1px solid var(--paperDeep);border-radius:10px;padding:14px 8px;text-align:center;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--inkSoft)}
.clip-arrow{position:absolute;right:2%;top:84px;font-size:32px;color:var(--gold);font-weight:700}
.center{text-align:center;max-width:420px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--paperDeep);margin:0 3px}.dot.on{background:var(--crimson)}
</style></head><body>
<div class="clipdemo"><div class="clip back"></div><div class="clip front"><div class="cliptop"><span class="clip-clip"></span><span class="clip-ttl">Your areas</span></div><div class="clipgrid"><span>Garden</span><span>People</span><span>Saved</span><span>Privacy</span></div></div><div class="clip-arrow">&rsaquo;</div></div>
<div class="center"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
</body></html>
