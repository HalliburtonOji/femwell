<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#ECE7DA;font-family:Georgia,serif;color:#2E261B}
  .wrap{padding:24px}
  .row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;width:230px}
  .lbl{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#6B5840}
  h2{font-family:Georgia;font-style:italic;color:#A8893F;font-weight:500;margin:24px 0 8px}
  .card{background:#F4EFE3;border:1px solid #D8CFBC;border-radius:18px;padding:10px}
</style></head><body><div class="wrap" id="root"></div>
<script>
// ── colour helpers (mirror flora.jsx) ──
function lighten(hex, amt){const n=parseInt(hex.replace('#',''),16);const r=Math.min(255,((n>>16)&255)+Math.round(255*amt));const g=Math.min(255,((n>>8)&255)+Math.round(255*amt));const b=Math.min(255,(n&255)+Math.round(255*amt));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function darken(hex, amt){const n=parseInt(hex.replace('#',''),16);const r=Math.max(0,((n>>16)&255)-Math.round(255*amt));const g=Math.max(0,((n>>8)&255)-Math.round(255*amt));const b=Math.max(0,(n&255)-Math.round(255*amt));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

const COLORWAYS={
  crimson:{petal:'#BC2E27',tip:'#D9554E',accent:'#2E261B'},
  blush:{petal:'#E8B4B8',tip:'#F4D9DC',accent:'#A8893F'},
  gold:{petal:'#D4AF37',tip:'#E8CE78',accent:'#6B5840'},
  sage:{petal:'#8FAF8F',tip:'#B6CDB6',accent:'#2E261B'},
  plum:{petal:'#8E6E8E',tip:'#B196B1',accent:'#D4AF37'},
  coral:{petal:'#E08A6A',tip:'#F0B79E',accent:'#8E3B2C'},
  sky:{petal:'#9FB6C9',tip:'#C3D2DE',accent:'#5F7E8E'},
  cream:{petal:'#E4DAC1',tip:'#F2EAD6',accent:'#A8893F'},
};
const GOLD_ANGLE=137.50776;
const cx=50, cy=52;

// build the <defs> gradients shared by a bloom
function defs(gid, color, accent){
  const lightest=lighten(color,0.52),light=lighten(color,0.34),mid=lighten(color,0.14),deep=color,deeper=darken(color,0.13),darkest=darken(color,0.3),sheen=lighten(color,0.62);
  return `<defs>
    <linearGradient id="pO-${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${light}"/><stop offset="24%" stop-color="${mid}"/><stop offset="68%" stop-color="${deep}"/><stop offset="100%" stop-color="${deeper}"/></linearGradient>
    <linearGradient id="pM-${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${lightest}"/><stop offset="30%" stop-color="${light}"/><stop offset="72%" stop-color="${mid}"/><stop offset="100%" stop-color="${deep}"/></linearGradient>
    <linearGradient id="pI-${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${sheen}"/><stop offset="45%" stop-color="${lightest}"/><stop offset="100%" stop-color="${light}"/></linearGradient>
    <radialGradient id="gl-${gid}" cx="50%" cy="44%" r="54%"><stop offset="0%" stop-color="${lightest}" stop-opacity="0.40"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></radialGradient>
    <radialGradient id="ct-${gid}" cx="42%" cy="38%" r="64%"><stop offset="0%" stop-color="${lighten(accent,0.34)}"/><stop offset="60%" stop-color="${accent}"/><stop offset="100%" stop-color="${darken(accent,0.16)}"/></radialGradient>
    <radialGradient id="occ-${gid}" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="${darkest}" stop-opacity="0.55"/><stop offset="55%" stop-color="${darkest}" stop-opacity="0.28"/><stop offset="100%" stop-color="${darkest}" stop-opacity="0"/></radialGradient>
    <radialGradient id="disc-${gid}" cx="42%" cy="40%" r="64%"><stop offset="0%" stop-color="#A07A2E"/><stop offset="58%" stop-color="#6E4F1C"/><stop offset="100%" stop-color="#4A3412"/></radialGradient>
    <linearGradient id="st-${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8FAF8F"/><stop offset="100%" stop-color="#5F7E5F"/></linearGradient>
    <linearGradient id="lf-${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A6C6A6"/><stop offset="55%" stop-color="#82A282"/><stop offset="100%" stop-color="#5F7E5F"/></linearGradient>
  </defs>`;
}

// stem + two leaves (shared base)
function stemLeaves(gid){
  return `<path d="M48.4 100 C 47.9 86 49.4 72 49 62 L 51 62 C 51.4 72 52 86 51.5 100 Z" fill="url(#st-${gid})"/>
  <g><path d="M49 80 C 37 76 29 79 26 88 C 37 90 47 85 49 79 Z" fill="url(#lf-${gid})" opacity="0.95"/>
  <path d="M49 80 C 41 81 33 84 27 88" stroke="#5F7E5F" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M51 73 C 63 69 71 72 74 81 C 63 83 53 78 51 72 Z" fill="url(#lf-${gid})" opacity="0.9"/>
  <path d="M51 73 C 59 74 67 77 73 81" stroke="#5F7E5F" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.65"/></g>`;
}

// ============ ROSE — the hero. Reflexed guard petals → a SPIRAL furled heart. ============
function roseHead(color, accent, gid){
  const lightest=lighten(color,0.52),light=lighten(color,0.34),mid=lighten(color,0.14),deep=color,deeper=darken(color,0.13),sheen=lighten(color,0.62);
  // a broad cupped guard petal
  function guard(len,wid){return `M0 0 C ${-wid} ${-len*0.28} ${-wid*0.98} ${-len*0.74} ${-wid*0.46} ${-len*0.95} C ${-wid*0.18} ${-len*1.04} ${wid*0.18} ${-len*1.04} ${wid*0.46} ${-len*0.95} C ${wid*0.98} ${-len*0.74} ${wid} ${-len*0.28} 0 0 Z`;}
  // a furl/wrap crescent for the spiral heart (convex edge wraps clockwise)
  const wrap = "M0 0 C -8 -2 -10.5 -11 -3.5 -15.5 C 1.5 -18.5 9.5 -14 8 -6.5 C 7 -1.8 1.2 -2.4 1.6 -7";
  let s='<g>';
  // ring 1 — 5 reflexed guard petals (darkest, widest)
  for(let i=0;i<5;i++){const a=i*72; s+=`<path d="${guard(34,15)}" fill="url(#pO-${gid})" stroke="${deeper}" stroke-width="0.5" stroke-opacity="0.22" transform="translate(${cx} ${cy}) rotate(${a})"/>`;}
  // ring 2 — 5 cupped petals offset
  for(let i=0;i<5;i++){const a=36+i*72; s+=`<path d="${guard(27,12.5)}" fill="url(#pM-${gid})" stroke="${deep}" stroke-width="0.4" stroke-opacity="0.2" transform="translate(${cx} ${cy}) rotate(${a})"/>
    <path d="M0 ${-27*0.2} Q 2 ${-27*0.55} 0 ${-27*0.86}" stroke="${sheen}" stroke-width="0.5" stroke-opacity="0.3" fill="none" transform="translate(${cx} ${cy}) rotate(${a})"/>`;}
  // ring 3 — 5 inner cupped
  for(let i=0;i<5;i++){const a=i*72; s+=`<path d="${guard(20,10)}" fill="url(#pM-${gid})" stroke="${deep}" stroke-width="0.4" stroke-opacity="0.2" transform="translate(${cx} ${cy}) rotate(${a})"/>`;}
  // throat shadow under the spiral
  s+=`<circle cx="${cx}" cy="${cy}" r="14" fill="url(#occ-${gid})"/>`;
  // the SPIRAL FURLED HEART — overlapping wrap crescents coiling inward
  const N=9;
  for(let i=0;i<N;i++){const ang=i*52, sc=1.45-i*0.115;
    s+=`<path d="${wrap}" transform="translate(${cx} ${cy}) rotate(${ang}) scale(${sc})" fill="url(#${i%2?'pI':'pM'}-${gid})" stroke="${deeper}" stroke-width="0.4" stroke-opacity="0.26" opacity="0.99"/>`;}
  s+=`<circle cx="${cx}" cy="${cy}" r="1.8" fill="${deeper}" opacity="0.55"/>`;
  // top-left sheen
  s+=`<ellipse cx="${cx-8}" cy="${cy-9}" rx="4" ry="2.4" fill="#FFFDF7" opacity="0.22" transform="rotate(-28 ${cx-8} ${cy-9})"/>`;
  s+='</g>';
  return s;
}

// ============ SUNFLOWER — ray florets + phyllotaxis seed disc ============
function sunflowerHead(color, accent, gid){
  const deep=color, deeper=darken(color,0.13);
  function ray(len,wid){return `M0 0 C ${-wid} ${-len*0.32} ${-wid*0.6} ${-len*0.78} ${-wid*0.5} ${-len*0.93} C ${-wid*0.3} ${-len} ${wid*0.3} ${-len} ${wid*0.5} ${-len*0.93} C ${wid*0.6} ${-len*0.78} ${wid} ${-len*0.32} 0 0 Z`;}
  let s='<g>';
  for(let i=0;i<24;i++){const a=i*15; s+=`<path d="${ray(34,5.2)}" fill="url(#pO-${gid})" stroke="${deeper}" stroke-width="0.4" stroke-opacity="0.18" transform="translate(${cx} ${cy}) rotate(${a})"/>`;}
  for(let i=0;i<24;i++){const a=7.5+i*15; s+=`<path d="${ray(29,4.6)}" fill="url(#pM-${gid})" transform="translate(${cx} ${cy}) rotate(${a})"/>`;}
  // seed disc
  s+=`<circle cx="${cx}" cy="${cy}" r="15.5" fill="url(#disc-${gid})"/>`;
  for(let i=0;i<150;i++){const a=i*GOLD_ANGLE*Math.PI/180; const rr=1.32*Math.sqrt(i); if(rr>14.5)continue; s+=`<circle cx="${(cx+Math.cos(a)*rr).toFixed(2)}" cy="${(cy+Math.sin(a)*rr).toFixed(2)}" r="0.82" fill="${i%2?'#5E4419':'#7A5A22'}" opacity="0.92"/>`;}
  s+=`<circle cx="${cx}" cy="${cy}" r="15.5" fill="none" stroke="${darken(color,0.24)}" stroke-width="0.7" opacity="0.4"/>`;
  s+=`<ellipse cx="${cx-5}" cy="${cy-5}" rx="4" ry="2.4" fill="#FFFFFF" opacity="0.10" transform="rotate(-30 ${cx-5} ${cy-5})"/>`;
  s+='</g>';
  return s;
}

// ============ HIBISCUS — 5 broad veined petals + deep throat + staminal column ============
function hibiscusHead(color, accent, gid){
  const deep=color, deeper=darken(color,0.13);
  function broad(len,wid){return `M0 0 C ${-wid*1.05} ${-len*0.2} ${-wid*1.04} ${-len*0.62} ${-wid*0.52} ${-len*0.9} C ${-wid*0.22} ${-len*1.05} ${wid*0.22} ${-len*1.05} ${wid*0.52} ${-len*0.9} C ${wid*1.04} ${-len*0.62} ${wid*1.05} ${-len*0.2} 0 0 Z`;}
  let s='<g>';
  // 5 broad petals
  for(let i=0;i<5;i++){const a=i*72; s+=`<g transform="translate(${cx} ${cy}) rotate(${a})"><path d="${broad(37,16)}" fill="url(#pO-${gid})" stroke="${deeper}" stroke-width="0.4" stroke-opacity="0.18"/>`;
    for(const k of [-1,0,1]) s+=`<path d="M0 -3 Q ${k*3.6} -19 ${k*2.3} -33" stroke="${darken(color,0.24)}" stroke-width="0.45" stroke-opacity="0.32" fill="none" stroke-linecap="round"/>`;
    s+='</g>';}
  // dark throat
  s+=`<circle cx="${cx}" cy="${cy}" r="11" fill="${darken(color,0.46)}"/><circle cx="${cx}" cy="${cy}" r="13" fill="url(#occ-${gid})"/>`;
  // staminal column projecting up-right
  s+=`<path d="M${cx} ${cy} Q ${cx+9} ${cy-17} ${cx+13} ${cy-31}" stroke="${darken(color,0.18)}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  for(let i=0;i<11;i++){const t=i/11; const px=cx+9*t*1.1+(i%2?2.1:-2.1); const py=cy-22*t-6; s+=`<circle cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="1.25" fill="#E9CF7A" stroke="#B98F2E" stroke-width="0.2"/>`;}
  // 5 stigma lobes at tip
  for(let i=0;i<5;i++){const a=i*72*Math.PI/180; s+=`<circle cx="${(cx+13+Math.cos(a)*2.4).toFixed(2)}" cy="${(cy-31+Math.sin(a)*2.4).toFixed(2)}" r="1.5" fill="${darken(color,0.05)}"/>`;}
  s+=`<ellipse cx="${cx-8}" cy="${cy-9}" rx="4" ry="2.4" fill="#FFFDF7" opacity="0.18" transform="rotate(-28 ${cx-8} ${cy-9})"/>`;
  s+='</g>';
  return s;
}

const HEADS={rose:roseHead, sunflower:sunflowerHead, hibiscus:hibiscusHead};

function bloom(form, cwKey, size){
  const cw=COLORWAYS[cwKey]; const gid=form+'-'+cwKey;
  const head=HEADS[form](cw.petal, cw.accent, gid);
  return `<svg viewBox="0 0 100 108" width="${size}" height="${Math.round(size*1.08)}" style="overflow:visible">
    ${defs(gid, cw.petal, cw.accent)}
    <ellipse cx="${cx}" cy="103" rx="21" ry="4.6" fill="#2E261B" opacity="0.20"/>
    <circle cx="${cx}" cy="${cy}" r="40" fill="url(#gl-${gid})"/>
    ${stemLeaves(gid)}
    ${head}
  </svg>`;
}

const root=document.getElementById('root');
function cell(form,cw,label){return `<div class="cell"><div class="card">${bloom(form,cw,200)}</div><div class="lbl">${label}</div></div>`;}
root.innerHTML = `<h2>The hero flowers — recognisable at a glance?</h2>
<div class="row">
  ${cell('rose','crimson','Rose')}
  ${cell('sunflower','gold','Sunflower')}
  ${cell('hibiscus','coral','Hibiscus')}
</div>
<h2>Rose across colourways</h2>
<div class="row">
  ${cell('rose','crimson','crimson')}
  ${cell('rose','blush','blush')}
  ${cell('rose','gold','gold')}
  ${cell('rose','plum','plum')}
</div>`;
</script></body></html>
